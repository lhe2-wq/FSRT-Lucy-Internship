[package]
name = "fsrt"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
graphql_schema = []
# Native Rust session-cookie harvester (ports poc/mint_session_cookie_spike.py).
# Off by default so normal builds stay lean and don't pull in tokio + a full
# async HTTP/WebDriver stack. Enable with `--features mint_cookie`.
mint_cookie = ["dep:thirtyfour", "dep:tokio", "dep:rand"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap.workspace = true
config.workspace = true
forge_analyzer.workspace = true
forge_file_resolver.workspace = true
forge_loader.workspace = true
forge_permission_resolver.workspace = true
rustc-hash.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
swc_core.workspace = true
tracing-subscriber.workspace = true
tracing-tree.workspace = true
tracing.workspace = true
walkdir.workspace = true
graphql-parser = "0.4.0"
glob = "0.3.2"
regex.workspace = true
ureq = { version = "2", features = ["json"] }
thiserror.workspace = true
base64 = "0.22"

# --- optional deps for the `mint_cookie` feature (native WebDriver harvester) ---
# thirtyfour is an async Selenium/WebDriver client; tokio provides the runtime we
# bridge into from the otherwise-sync binary via a local `block_on`. rand adds the
# human-like typing/pacing jitter the Python spike uses to avoid bot-checks.
thirtyfour = { version = "0.37", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"], optional = true }
rand = { version = "0.8", optional = true }
